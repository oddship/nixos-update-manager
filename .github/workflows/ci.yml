name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Format, lint, and test
        run: nix develop --command bash -euo pipefail -c 'just lint && just test && just indicator-test'
      - name: Check real Nix lock isolation and package exports
        run: nix develop --command bash -euo pipefail -c 'python3 tests/probes/alternate_lock.py && python3 tests/probes/input-packages.py'
      - name: Build app, indicator, and verify executable interfaces
        run: |
          nix build --max-jobs 1 --cores 2 .#default .#gnome-extension .#checks.x86_64-linux.package-interfaces --no-link
      - name: Check public repository documentation and media
        run: python3 scripts/check-public-repo.py
  vm:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Exact-system activation and authenticated Apply/commit guests
        run: |
          nix build --max-jobs 1 --cores 2 .#checks.x86_64-linux.vm-smoke --no-link -L
          nix build --max-jobs 1 --cores 2 .#checks.x86_64-linux.vm-helper --no-link -L
          nix build --max-jobs 1 --cores 2 .#checks.x86_64-linux.vm-apply --no-link -L
